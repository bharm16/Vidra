name: Build and Push Docker Image

on:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # For OIDC signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            SPAN_LABELING_MODELS_GCS_URI=${{ secrets.SPAN_LABELING_MODELS_GCS_URI }}

      # github.repository is "bharm16/Vidra", but OCI repository names must be
      # lowercase. metadata-action lowercases the tags it emits, so the pushed
      # image is .../vidra — anything built from env.IMAGE_NAME directly keeps
      # the capital V and is rejected as an invalid reference.
      - name: Resolve lowercase image reference
        run: |
          # tr rather than ${VAR,,} so the same line is verifiable on a bash 3.2
          # shell (macOS) as on the runner's bash 5.
          lower=$(printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REF=${lower}" >> "$GITHUB_ENV"

      # Install Cosign for image signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Sign the image with Cosign (keyless signing)
      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Signing image with digest: ${DIGEST}"
          # metadata-action emits one tag per line. Quoting the whole list made
          # "${TAGS}@${DIGEST}" a single newline-laden argument, and cosign
          # rejected it: "could not parse reference". Sign each tag separately
          # against the one digest instead.
          echo "${TAGS}" | xargs -I {} cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            "{}@${DIGEST}"

      - name: Generate SBOM
        # SBOM scans the registry image, which only exists when push: true
        # (i.e. on push to main/develop or tag, not on PR builds). On PR
        # the digest output is empty, so the syft scan target becomes
        # "ghcr.io/.../...@" with no digest and Syft errors. Match the
        # condition on the Sign and Attach SBOM steps below.
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}@${{ steps.build-and-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Attach SBOM to image
        if: github.event_name != 'pull_request'
        run: |
          cosign attach sbom --sbom sbom.spdx.json \
            "${IMAGE_REF}@${{ steps.build-and-push.outputs.digest }}"
