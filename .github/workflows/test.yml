name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 5 * * *"

jobs:
  arch-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run architecture checks
        run: npm run arch:check

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY || 'sk-test-key' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'test-key' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'test-project' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'test.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || 'test-app-id' }}
          NODE_ENV: test

      - name: Golden-path replay gate (offline, zero network)
        run: npm run test:replay
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY || 'sk-test-key' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'test-key' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'test-project' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'test.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || 'test-app-id' }}
          NODE_ENV: test

      - name: Generate coverage report
        run: npm run test:coverage
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY || 'sk-test-key' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'test-key' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'test-project' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'test.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || 'test-app-id' }}
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Archive coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        if: always()

  regression-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check regression test mock boundaries
        run: npm run test:regression:quality

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        # Mirrors the local pre-commit gate documented in CLAUDE.md so
        # `git commit --no-verify` cannot smuggle type errors past CI.
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Enforce critical lint families
        run: npm run lint:critical

      - name: Check code formatting
        run: npm run format:check

  integration-firestore:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java (Firestore emulator requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # firebase-tools >= 15 refuses to start the emulator on anything below
          # JDK 21 ("no longer supports Java version before 21"). The step below
          # installs whatever npm currently publishes, so this pin has to track
          # that requirement rather than the other way around.
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        # Unpinned on purpose today, but note the hazard: a firebase-tools
        # release can break this job with no commit to this repo — which is
        # exactly how the JDK 21 requirement arrived.
        run: npm install -g firebase-tools

      - name: Run integration tests against Firestore emulator
        # The command must reach firebase as ONE argument. The backslashes that
        # used to escape these quotes were literal in a YAML plain scalar, so
        # the shell passed `\"npm`, `run`, `test:integration\"` as three args
        # and firebase rejected them with "Too many arguments" — the emulator
        # never started and no integration test ran.
        run: firebase emulators:exec --project demo-test --only firestore "npm run test:integration"
        env:
          RUN_FIREBASE_INTEGRATION: "true"
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          GCLOUD_PROJECT: demo-test
          VITE_FIREBASE_PROJECT_ID: demo-test
          VITE_FIREBASE_API_KEY: test-key
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: test-app-id
          ALLOWED_API_KEYS: dev-key-12345
          NODE_ENV: test

  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, lint, integration-firestore]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Check bundle size
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          find dist/ -type f -name "*.js" -exec du -h {} \; | sort -rh | head -10 >> $GITHUB_STEP_SUMMARY

  quality-gate:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    # FROZEN 2026-08-07 — does not run, does not gate merges, spends nothing.
    #
    # Its number is not currently interpretable. The eval draws a random,
    # UNSEEDED 25 of 54 prompts (span-labeling-evaluation.ts `--sample`) and
    # compares that subset's mean against a baseline mean over all 54 — two
    # different populations. Against the baseline's own spread (n=54, sd 1.76)
    # the standard error of a 25-prompt mean is 0.26, so the 0.50 allowed drop
    # is 1.9 SE: sampling error alone fails this gate roughly 1 run in 41 with
    # zero regression, and because the draw is unseeded the same commit can
    # pass or fail on re-run. The judge is likewise unpinned (no seed, no
    # temperature), which adds variance on top.
    #
    # The baseline snapshot is also stale: its content timestamp is
    # 2025-12-25, predating LightingService, the visual-only filter, the July
    # span-labeling unification, and the provider-routing change. It encodes
    # the extraction policy those commits deliberately replaced.
    #
    # To unfreeze: seed the sample (or evaluate all 54), pin the judge seed and
    # temperature, re-bless the baseline on current main, then restore
    #   if: github.event_name != 'schedule'
    #
    # The secrets context is not available inside `if:`, so the old
    # `secrets.OPENAI_API_KEY != ''` clause failed the workflow at startup.
    # Job env is readable from a step-level `if:`, so the key gate moves onto
    # the steps that actually need it.
    if: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate (real LLM eval)
        if: env.OPENAI_API_KEY != ''
        run: npm run quality:gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QUALITY_GATE_SAMPLE_SIZE: "25"
          QUALITY_GATE_MAX_SCORE_DROP: "0.5"
          QUALITY_GATE_MIN_SCORE: "15"
          QUALITY_GATE_MAX_HARD_REGRESSIONS: "0"
          NODE_ENV: test
          REDIS_DISABLED: "true"

      - name: Generate regression report (non-blocking)
        if: env.OPENAI_API_KEY != ''
        run: npm run eval:regression
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: test
          REDIS_DISABLED: "true"

      - name: Upload quality gate artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-artifacts
          path: |
            scripts/evaluation/snapshots/latest.json
            scripts/evaluation/snapshots/report.md
          if-no-files-found: ignore
          retention-days: 7

  quality-gate-nightly:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    # FROZEN 2026-08-07 — see quality-gate above for why. This job compares a
    # full 54 against the baseline's 54 (SAMPLE_SIZE 120 exceeds the corpus, so
    # no sampling happens), which is the statistically sound half of the pair —
    # but it reads the same 2025-12-25 baseline, so it is stale for the same
    # reason. Unfreeze it together with quality-gate by restoring
    #   if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    #
    # Same startup-failure fix as quality-gate above: no secrets context in `if:`.
    if: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run nightly quality gate (expanded sample)
        if: env.OPENAI_API_KEY != ''
        run: npm run quality:gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QUALITY_GATE_SAMPLE_SIZE: "120"
          QUALITY_GATE_MAX_SCORE_DROP: "0.5"
          QUALITY_GATE_MIN_SCORE: "15"
          QUALITY_GATE_MAX_HARD_REGRESSIONS: "0"
          NODE_ENV: test
          REDIS_DISABLED: "true"

      - name: Generate nightly regression report (non-blocking)
        if: env.OPENAI_API_KEY != ''
        run: npm run eval:regression
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: test
          REDIS_DISABLED: "true"

      - name: Upload nightly quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-nightly-artifacts
          path: |
            scripts/evaluation/snapshots/latest.json
            scripts/evaluation/snapshots/report.md
          if-no-files-found: ignore
          retention-days: 14
