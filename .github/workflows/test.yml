name: Test Suite

on:
  push:
    branches: [main, develop]
  # No `branches:` filter on purpose. Gating pull_request on a base branch
  # means a PR based on any other branch — every PR in a stack but the
  # bottom one — runs none of this, and GitHub only retargets a stacked
  # PR's base to main when the base branch is DELETED after merging. The
  # #81-#90 stack merged with two checks per PR instead of fourteen
  # because of this. `push:` keeps its branch filter; pull_request does not.
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    # One env block for the whole job — this used to be restated verbatim on
    # all three steps, and a fourth near-copy in integration-firestore had
    # already forked its values.
    env:
      VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY || 'sk-test-key' }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'test-key' }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'test-project' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'test.appspot.com' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || 'test-app-id' }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (root + server configs)
        # The script also compiles server/tsconfig.json (lib: ES2022, node
        # types) — the only check that catches server code reaching for a
        # DOM global. That coverage used to arrive via a unit test that
        # shelled out to tsc; the test was removed for costing 55s, so a
        # bare root `tsc --noEmit` here would silently drop it from CI.
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Enforce package entry points and reject dependency cycles
        run: npm run lint:boundaries

  integration-firestore:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java (Firestore emulator requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # firebase-tools >= 15 refuses to start the emulator on anything below
          # JDK 21 ("no longer supports Java version before 21"). The step below
          # installs whatever npm currently publishes, so this pin has to track
          # that requirement rather than the other way around.
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        # Unpinned on purpose today, but note the hazard: a firebase-tools
        # release can break this job with no commit to this repo — which is
        # exactly how the JDK 21 requirement arrived.
        run: npm install -g firebase-tools

      - name: Install native media tools
        # Native export, frame and audio-import suites run real ffmpeg/ffprobe,
        # matching the production image (infrastructure/docker/Dockerfile).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run integration tests against Firestore emulator
        # The command must reach firebase as ONE argument. The backslashes that
        # used to escape these quotes were literal in a YAML plain scalar, so
        # the shell passed `\"npm`, `run`, `test:integration\"` as three args
        # and firebase rejected them with "Too many arguments" — the emulator
        # never started and no integration test ran.
        run: firebase emulators:exec --project demo-test --only firestore,auth "npm run test:integration"
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          GCLOUD_PROJECT: demo-test
          VITE_FIREBASE_PROJECT_ID: demo-test
          VITE_FIREBASE_API_KEY: test-key
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: test-app-id
          ALLOWED_API_KEYS: dev-key-12345
          NODE_ENV: test

  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, lint, integration-firestore]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
