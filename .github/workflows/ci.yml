name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The secrets context is not available inside an `if:` expression, so
    # `if: ${{ secrets.GCP_SA_KEY != '' }}` below failed the whole workflow at
    # startup — every run ended in 0s with no steps executed. Hoisting the key
    # into env lets the step gate on `env.`, which is the shape security-scan.yml
    # already uses successfully.
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Authenticate Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Download span-labeling models
        env:
          SPAN_LABELING_MODELS_GCS_URI: ${{ secrets.SPAN_LABELING_MODELS_GCS_URI }}
        run: npm run download-models

      - name: Lint
        run: npm run lint --if-present

      - name: Route map freshness
        # ROUTE_MAP.md is auto-generated by scripts/generate-route-map.ts. If
        # anything under server/src/routes changes without a regenerate, this
        # fails — matching the claim in the generated doc header.
        run: npm run routemap:check

      - name: Architecture map freshness
        # docs/architecture/architecture-map.json is auto-generated by
        # scripts/generate-architecture-map.ts. Fails if any source file
        # (routes, feature-flags, services.config, CLAUDE.md) has changed
        # without a corresponding `npm run architecture:map:write`.
        run: npm run architecture:map:check

      - name: Run unit tests
        env:
          NODE_ENV: test
          ALLOWED_API_KEYS: dev-key-12345
        run: npm run test:unit

      - name: Coverage (if configured)
        run: |
          if npm run | grep -q "test:coverage"; then
            npm run test:coverage;
          else
            echo "No coverage script configured";
          fi
