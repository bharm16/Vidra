name: E2E Testing

on:
  push:
    branches: [main, develop]
  # No `branches:` filter on purpose. Gating pull_request on a base branch
  # means a PR based on any other branch — every PR in a stack but the
  # bottom one — runs none of this, and GitHub only retargets a stacked
  # PR's base to main when the base branch is DELETED after merging. The
  # #81-#90 stack merged with two checks per PR instead of fourteen
  # because of this. `push:` keeps its branch filter; pull_request does not.
  pull_request:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Microsoft Playwright image bundles Chromium/Firefox/WebKit and
    # all their apt dependencies, so the previous `npx playwright install
    # --with-deps` step (~3m45s of apt-get + binary download) goes away.
    # Pin the tag to the @playwright/test version in package.json to keep
    # them in lockstep on upgrades.
    container: mcr.microsoft.com/playwright:v1.56.0-noble

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run provider-free browser tests (20 cases)
        run: npx playwright test --config config/test/playwright.pr.config.js
        env:
          HOME: /root
          CI: true
          VITE_ANTHROPIC_API_KEY: sk-test-key
          VITE_FIREBASE_API_KEY: test-key
          VITE_FIREBASE_PROJECT_ID: test-project
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: test-app-id

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-videos
          path: test-results/
          retention-days: 7
